<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabinet – Gestion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#f3f6f7;--surface:#fff;--ink:#12303a;--mute:#5d7480;--line:#d9e2e6;--accent:#0b6e7f;--accent-ink:#fff;--late:#b3261e;--late-bg:#fbe9e7;--ok:#2e7d4f;--ok-bg:#e4f3ea;--warn:#8a5a00;--warn-bg:#fdf0d5;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b20;--surface:#162830;--ink:#e6eef1;--mute:#93a9b3;--line:#27404a;--accent:#4cc3d6;--accent-ink:#06222a;--late:#ff9a92;--late-bg:#3a1f1d;--ok:#7fd3a0;--ok-bg:#183326;--warn:#f0c46a;--warn-bg:#3a2e12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1b20;--surface:#162830;--ink:#e6eef1;--mute:#93a9b3;--line:#27404a;--accent:#4cc3d6;--accent-ink:#06222a;--late:#ff9a92;--late-bg:#3a1f1d;--ok:#7fd3a0;--ok-bg:#183326;--warn:#f0c46a;--warn-bg:#3a2e12;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "IBM Plex Sans",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:60;padding:14px 16px 0;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:19px;font-weight:600;margin:0 0 10px}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{flex:1;min-width:max-content;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:500 15px inherit;font-family:inherit;color:var(--mute);cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
main{max-width:720px;margin:0 auto;padding:16px}
h2{font-size:15px;font-weight:600;margin:22px 0 8px;color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font:500 24px "IBM Plex Mono",monospace}
.stat span{font-size:13px;color:var(--mute)}
.stat.alert b{color:var(--late)}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:center}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500}
.row .s{font-size:13px;color:var(--mute)}
.amt{font:500 15px "IBM Plex Mono",monospace;white-space:nowrap}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;border:0;white-space:nowrap;background:var(--line);color:var(--ink)}
.pill.late{background:var(--late-bg);color:var(--late)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
button.pill{cursor:pointer;font-family:inherit}
.chk{width:22px;height:22px;accent-color:var(--accent);flex:none}
.done .t{text-decoration:line-through;color:var(--mute)}
.x{background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 8px}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
summary{padding:12px;font-weight:500;color:var(--accent);cursor:pointer}
.form{display:grid;gap:8px;padding:0 12px 12px}
input,select,textarea{width:100%;padding:11px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px;font:600 15px inherit;font-family:inherit;cursor:pointer}
.empty{color:var(--mute);padding:20px 0;text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ym{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;margin-top:14px}.mc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}.mh{display:flex;justify-content:space-between;margin-bottom:8px}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px;margin-bottom:8px}.cg i{color:var(--mute);font-style:normal;font-weight:600}.dc{border:0;background:none;color:var(--ink);padding:6px 0;border-radius:6px;font:inherit;cursor:pointer}.dc.ok{background:var(--ok-bg);color:var(--ok);font-weight:600}.dc.warn{background:var(--warn-bg);color:var(--warn);font-weight:600}.dc.late{background:var(--late-bg);color:var(--late);font-weight:600}.dc.tod{outline:1px solid var(--accent)}.cr{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.rt{width:100%;border-collapse:collapse;font-size:14px}.rt th,.rt td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.rt th{color:var(--mute);font-weight:600;font-size:12px}
.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.pv{background:#fff;color:#111;border-radius:10px;padding:16px;margin-top:16px;border:1px solid var(--line);font-size:14px}
.pv table{width:100%;border-collapse:collapse}.pv th,.pv td{padding:6px 4px;border-bottom:1px solid #ddd;text-align:left}.pv th:nth-child(n+2),.pv td:nth-child(n+2){text-align:right}
.auth-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.auth-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:380px;display:grid;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.35)}.auth-foot{border-top:1px solid var(--line);padding-top:12px;text-align:center;font-size:14px}.lnk{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline;padding:0}
.pg{background:#fff;color:#111;border:1px solid var(--line);border-radius:4px;padding:22px 18px;font:14px/1.65 "Times New Roman",Georgia,serif;min-height:360px;outline:none;box-shadow:0 1px 6px rgba(0,0,0,.12)}.pg p{margin:0 0 6px}.pg h3{margin:12px 0 6px;font-size:15px}.tb{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.tb .pill{padding:6px 10px;font-size:13px;cursor:pointer}
@media print{header,body::before,main>*:not(.pv):not(.pgw){display:none!important}.pv,.pgw{border:0;margin:0}.pgw{overflow:visible!important}.pg{border:0;padding:0;box-shadow:none}}
</style>
</head>
<body>
<header>
<h1>Cabinet Amine Boudaya</h1>
<nav role="tablist">
<button role="tab" data-v="dash">Tableau de bord</button>
<button role="tab" data-v="clients">Clients</button>
<button role="tab" data-v="tasks">Échéances</button>
<button role="tab" data-v="inv">Facturation</button>
<button role="tab" data-v="frais">Notes de frais</button>
<button role="tab" data-v="interne">Interne</button>
<button role="tab" data-v="compta">Comptabilité</button>
<button role="tab" data-v="paie">Paie</button>
<button role="tab" data-v="liasse">Liasse fiscale</button>
<button role="tab" data-v="decl">Déclarations</button>
<button role="tab" data-v="aud">Audit et commissariat aux comptes</button>
<button role="tab" data-v="gedt">GED</button>
</nav>
</header>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
<script>
var KEY="cabinet-v2",view="dash",S;
function iso(n){var d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function seed(){return{n:20,
clients:[{id:1,nom:"Boulangerie Dupain",forme:"SARL",mission:"Tenue + bilan",fee:450,mf:"1234567/A/M/000",cnss:"12345678-90",mi:"",cap:20000,adr:"12 rue de la République, Tunis",g:"Ben Salah Karim",cin:"07654321",nat:"Tunisienne",gadr:"12 rue de la République, Tunis",dn:"1978-03-14",ln:"Tunis"},{id:2,nom:"Studio Mirage",forme:"SAS",mission:"Bilan + paie",fee:780,mf:"2345678/B/M/000",cnss:"23456789-01",mi:"",cap:50000,adr:"5 avenue Habib Bourguiba, Sfax",g:"Trabelsi Sonia",cin:"09876543",nat:"Tunisienne",gadr:"21 rue de Palestine, Sfax",dn:"1985-11-02",ln:"Sfax"},{id:3,nom:"Dr Hélène Roux",forme:"Libéral (BNC)",mission:"Déclaration 2035",fee:300,mf:"3456789/C/N/000",cnss:"",mi:"IND-45678",cap:0,adr:"8 rue Ibn Khaldoun, Sousse",g:"Roux Hélène",cin:"19AB12345 (passeport)",nat:"Française",gadr:"8 rue Ibn Khaldoun, Sousse",dn:"1972-06-21",ln:"Lyon"},{id:4,nom:"Garage Bertin",forme:"EURL",mission:"Tenue + TVA",fee:520,mf:"4567890/D/M/000",cnss:"34567890-12",mi:"",cap:10000,adr:"Zone industrielle, Ariana",g:"Bertin Marc",cin:"05432109",nat:"Tunisienne",gadr:"3 rue des Jasmins, Ariana",dn:"1969-09-30",ln:"Ariana"}],
tasks:[{id:1,c:4,type:"TVA mensuelle",due:iso(-2),done:false},{id:2,c:1,type:"Liasse fiscale",due:iso(3),done:false},{id:3,c:2,type:"Paie d’octobre",due:iso(5),done:false},{id:4,c:3,type:"Déclaration 2035",due:iso(21),done:false},{id:5,c:2,type:"Approbation des comptes",due:iso(-10),done:true}],
inv:[{id:1,c:1,amt:450,date:iso(-20),st:2},{id:2,c:2,amt:780,date:iso(-12),st:1},{id:3,c:4,amt:520,date:iso(-4),st:1},{id:4,c:3,amt:300,date:iso(0),st:0}]}}
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return{n:20,clients:[],tasks:[],inv:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function purge(){if(S.tpl&&S.tpl.statuts){S.tpl.sarl=S.tpl.sarl||S.tpl.statuts;S.tpl.suarl=S.tpl.suarl||S.tpl.statuts;delete S.tpl.statuts;save()}var N=["Boulangerie Dupain","Studio Mirage","Dr Hélène Roux","Garage Bertin"],ids=[];S.clients=S.clients.filter(function(c){if(c.id<=4&&N.indexOf(c.nom)>=0){ids.push(c.id);return false}return true});if(!ids.length)return;S.tasks=S.tasks.filter(function(t){return ids.indexOf(t.c)<0});S.inv=S.inv.filter(function(i){return ids.indexOf(i.c)<0});S.docs=(S.docs||[]).filter(function(d){return ids.indexOf(d.c)<0});save()}
S=load();purge();
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var eur=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"TND",minimumFractionDigits:0,maximumFractionDigits:0});
function fd(s){return new Date(s+"T00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}
function diff(s){var t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(s+"T00:00")-t)/864e5)}
function cn(id){var c=S.clients.filter(function(x){return x.id==id})[0];return c?c.nom:"—"}
function opts(){return S.clients.map(function(c){return'<option value="'+c.id+'">'+esc(c.nom)+"</option>"}).join("")}
function val(i){return document.getElementById(i).value.trim()}
function dueP(t){if(t.done)return'<span class="pill ok">Accomplie</span>';var d=diff(t.due);
return d<0?'<span class="pill late">'+(-d)+" j de retard</span>":d<=7?'<span class="pill warn">Dans '+d+" j</span>":'<span class="pill">'+fd(t.due)+"</span>"}
var ST=["À envoyer","Envoyée","Payée"],SC=["","warn","ok"];

function dash(){
var open=S.tasks.filter(function(t){return!t.done}).sort(function(a,b){return a.due<b.due?-1:1});
var late=open.filter(function(t){return diff(t.due)<0}).length;
var due=S.inv.filter(function(i){return i.kind!="devis"&&i.st<2}).reduce(function(s,i){return s+i.amt},0);
var paid=S.inv.filter(function(i){return i.kind!="devis"&&i.st==2}).reduce(function(s,i){return s+i.amt},0);
var h='<div class="stats"><div class="stat'+(late?" alert":"")+'"><b>'+late+'</b><span>échéances en retard</span></div><div class="stat"><b>'+open.length+'</b><span>échéances ouvertes</span></div><div class="stat"><b>'+eur.format(due)+'</b><span>honoraires à encaisser</span></div><div class="stat"><b>'+eur.format(paid)+'</b><span>encaissé</span></div></div><h2>À traiter en priorité</h2>';
h+=open.slice(0,5).map(function(t){return'<div class="row"><div class="main"><div class="t">'+esc(t.type)+'</div><div class="s">'+esc(cn(t.c))+"</div></div>"+dueP(t)+"</div>"}).join("")||'<div class="empty">Aucune échéance ouverte.</div>';
return h}

function clients(){
var h='<details id="cd"><summary>Ajouter ou modifier un client</summary><div class="form"><input id="cn" placeholder="Nom du client"><input id="cf" placeholder="Forme juridique (SARL, SAS…)"><select id="cpt"><option value="">Type : personne morale ou physique ?</option><option value="morale">Personne morale</option><option value="physique">Personne physique</option></select><input id="cdc" placeholder="Dénomination commerciale (nom commercial, enseigne)"><select id="cres"><option value="">Société résidente ou non résidente ?</option><option value="residente">Société résidente</option><option value="non_residente">Société non résidente</option></select><select id="cexp"><option value="">Régime d’exportation : aucun / non précisé</option><option value="totale">Totalement exportatrice</option><option value="partielle">Partiellement exportatrice</option></select><input id="cm" placeholder="Mission"><input id="cp" type="number" inputmode="numeric" placeholder="Honoraires mensuels (TND)"><input id="cmf" placeholder="Matricule fiscal"><input id="ccpt" placeholder="Compte comptable (ex. 411001)"><input id="ccn" placeholder="Matricule CNSS"><input id="cmi" placeholder="Matricule indépendant"><input id="ccap" type="number" inputmode="numeric" placeholder="Capital (TND)"><input id="cnp" type="number" inputmode="numeric" placeholder="Nombre de parts sociales" oninput="cap2()"><input id="cvn" type="number" inputmode="decimal" step="any" placeholder="Valeur nominale de la part sociale (TND)" oninput="cap2()"><input id="cad" placeholder="Adresse du client"><input id="cg" placeholder="Gérant : nom et prénom"><input id="cci" placeholder="Gérant : numéro de CIN"><label class="s" style="display:grid;gap:4px">Gérant : CIN délivrée le<input id="cgcd" type="date"></label><input id="cgcl" placeholder="Gérant : CIN délivrée à (lieu)"><input id="cgsj" placeholder="Gérant résident étranger : numéro de carte de séjour"><input id="cgpa" placeholder="Gérant étranger : numéro de passeport"><label class="s" style="display:grid;gap:4px">Gérant : passeport délivré le<input id="cgpd" type="date"></label><label class="s" style="display:grid;gap:4px">Gérant : passeport valable jusqu’au<input id="cgpv" type="date"></label><input id="cna" placeholder="Gérant : nationalité"><input id="cga" placeholder="Gérant : adresse"><label class="s" style="display:grid;gap:4px">Gérant : date de naissance<input id="cdn" type="date"></label><input id="cln" placeholder="Gérant : lieu de naissance"><label class="s" style="display:grid;gap:4px">Gérant : date de nomination<input id="cgnd" type="date"></label><input id="cgdu" placeholder="Gérant : durée de nomination (ex. illimitée, 3 ans)"><select id="cgs" onchange="gsw()"><option value="">Gérant : associé ou non ?</option><option value="1">Le gérant est associé</option><option value="0">Le gérant n’est pas associé</option></select><input id="cgp" type="number" inputmode="numeric" placeholder="Gérant : nombre de parts détenues" style="display:none"><input id="cgd" type="number" inputmode="numeric" placeholder="Gérant : parts numérotées de (ex. 1)" style="display:none" oninput="rgg()"><input id="cgf" type="number" inputmode="numeric" placeholder="Gérant : à (ex. 340)" style="display:none" oninput="rgg()"><select id="cgap" style="display:none"><option value="numeraire">Gérant : apport en numéraire</option><option value="nature">Gérant : apport en nature</option></select><div id="al" style="display:grid;gap:8px"></div><button class="go" style="background:none;color:var(--accent);border:1px solid var(--accent)" onclick="addA()">Ajouter un associé</button><button class="go" onclick="addC()">Ajouter le client</button></div></details>';
return h+(S.clients.map(function(c){return'<div class="row"><div class="main"><div class="t">'+esc(c.nom)+'</div><div class="s">'+esc(c.forme)+" · "+esc(c.mission)+'</div>'+info(c)+'<button class="pill ok" style="margin-top:8px" onclick="openDoc('+c.id+')">Rédiger statuts / PV</button><button class="pill" style="margin:8px 0 0 6px" onclick="openG('+c.id+')">Documents</button><button class="pill" style="margin:8px 0 0 6px" onclick="openC('+c.id+')">Calendrier annuel</button></div><span class="amt">'+eur.format(c.fee)+'/mois</span><button class="x" aria-label="Modifier" onclick="editC('+c.id+')">✎</button><button class="x" aria-label="Supprimer" onclick="delC('+c.id+')">×</button></div>'}).join("")||'<div class="empty">Aucun client. Ajoutez le premier ci-dessus.</div>')}

function tasks(){
var h='<details><summary>Ajouter une échéance</summary><div class="form"><select id="tc">'+opts()+'</select><input id="tt" placeholder="Type (TVA, bilan, paie…)"><input id="td" type="date" value="'+iso(7)+'"><button class="go" onclick="addT()">Ajouter l’échéance</button></div></details>';
var l=S.tasks.slice().sort(function(a,b){return a.done-b.done||(a.due<b.due?-1:1)}).filter(function(t){return tf=="all"||(tf=="done")==t.done});
return h+flt()+(l.map(function(t){return'<div class="row'+(t.done?" done":"")+'"><input class="chk" type="checkbox" aria-label="Terminé"'+(t.done?" checked":"")+' onchange="togT('+t.id+')"><div class="main"><div class="t">'+esc(t.type)+'</div><div class="s">'+esc(cn(t.c))+" · "+stl(t)+"</div></div>"+dueP(t)+'<button class="x" aria-label="Supprimer" onclick="delT('+t.id+')">×</button></div>'}).join("")||'<div class="empty">Aucune échéance.</div>')}

function inv(){
var h='<details><summary>Créer une facture</summary><div class="form"><select id="ic">'+opts()+'</select><input id="ia" type="number" inputmode="numeric" placeholder="Montant (€)"><input id="id" type="date" value="'+iso(0)+'"><button class="go" onclick="addI()">Créer la facture</button></div></details>';
var l=S.inv.slice().sort(function(a,b){return a.date<b.date?1:-1});
return h+(l.map(function(i){return'<div class="row"><div class="main"><div class="t">'+esc(cn(i.c))+'</div><div class="s">'+fd(i.date)+'</div></div><span class="amt">'+eur.format(i.amt)+'</span><button class="pill '+SC[i.st]+'" title="Changer le statut" onclick="cyc('+i.id+')">'+ST[i.st]+'</button><button class="x" aria-label="Supprimer" onclick="delI('+i.id+')">×</button></div>'}).join("")||'<div class="empty">Aucune facture.</div>')}

var eid=0;
function assocBlock(a){return '<div class="ab" style="display:grid;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px"><input class="an" placeholder="Associé : nom et prénom" value="'+esc(a.n||"")+'"><input class="ac" placeholder="Associé : numéro de CIN" value="'+esc(a.cin||"")+'"><label class="s" style="display:grid;gap:4px">Associé : CIN délivrée le<input class="acd" type="date" value="'+esc(a.cind||"")+'"></label><input class="acl" placeholder="Associé : CIN délivrée à (lieu)" value="'+esc(a.cinl||"")+'"><input class="asj" placeholder="Associé résident étranger : n° de carte de séjour" value="'+esc(a.csj||"")+'"><input class="apa" placeholder="Associé étranger : n° de passeport" value="'+esc(a.pas||"")+'"><label class="s" style="display:grid;gap:4px">Associé : passeport délivré le<input class="api" type="date" value="'+esc(a.pasd||"")+'"></label><label class="s" style="display:grid;gap:4px">Associé : passeport valable jusqu’au<input class="apv" type="date" value="'+esc(a.pasv||"")+'"></label><input class="at" placeholder="Associé : nationalité" value="'+esc(a.nat||"")+'"><input class="ad" placeholder="Associé : adresse" value="'+esc(a.adr||"")+'"><label class="s" style="display:grid;gap:4px">Associé : date de naissance<input class="adn" type="date" value="'+esc(a.dn||"")+'"></label><input class="aln" placeholder="Associé : lieu de naissance" value="'+esc(a.ln||"")+'"><input class="ap" type="number" inputmode="numeric" placeholder="Nombre de parts détenues" value="'+esc(a.p||"")+'"><input class="apd" type="number" inputmode="numeric" placeholder="Parts numérotées de (ex. 1)" value="'+esc(a.pd||"")+'" oninput="rg(this)"><input class="apf" type="number" inputmode="numeric" placeholder="à (ex. 340)" value="'+esc(a.pf||"")+'" oninput="rg(this)"><select class="aap"><option value="numeraire"'+(a.ap==="nature"?"":" selected")+'>Apport en numéraire</option><option value="nature"'+(a.ap==="nature"?" selected":"")+'>Apport en nature</option></select><button class="x" style="justify-self:end;font-size:14px" onclick="this.parentNode.remove()">Retirer cet associé</button></div>'}
